<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Engineering documentation and AI development workflow</title>
<desc id="desc">A conceptual view of the observed archive: product and UX evidence, engineering decisions, quality evidence, and continuity records support a development loop. This is separate from the software architecture.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#54758a"/></marker></defs>
<rect width="1000" height="650" rx="16" fill="#f3f6f8"/>
<g font-family="sans-serif" fill="#17384c">
<text x="40" y="48" font-size="26" font-weight="700">Preserving context across development sessions</text>
<text x="40" y="76" font-size="15" fill="#526c7b">Conceptual knowledge architecture · based on categories present in the archive</text>
<g fill="#fff" stroke="#ccdbe3"><rect x="60" y="116" width="390" height="136" rx="12"/><rect x="550" y="116" width="390" height="136" rx="12"/><rect x="550" y="320" width="390" height="136" rx="12"/><rect x="60" y="320" width="390" height="136" rx="12"/></g>
<text x="84" y="151" font-size="21" font-weight="700">Product and UX</text><text x="84" y="183" font-size="16">Research, hypotheses and requirements</text><text x="84" y="212" font-size="16">User journeys and acceptance criteria</text>
<text x="574" y="151" font-size="21" font-weight="700">Engineering decisions</text><text x="574" y="183" font-size="16">System and integration rationale</text><text x="574" y="212" font-size="16">Interface and data-design context</text>
<text x="574" y="355" font-size="21" font-weight="700">Quality evidence</text><text x="574" y="387" font-size="16">Scenarios and recorded executions</text><text x="574" y="416" font-size="16">Known limitations and open questions</text>
<text x="84" y="355" font-size="21" font-weight="700">Continuity and governance</text><text x="84" y="387" font-size="16">Decisions, versions and changelogs</text><text x="84" y="416" font-size="16">Current state and agent handoffs</text>
<g fill="none" stroke="#54758a" stroke-width="2" marker-end="url(#arrow)"><path d="M450 184H546"/><path d="M745 252V316"/><path d="M550 388H454"/><path d="M255 320V256"/></g>
<rect x="60" y="500" width="880" height="76" rx="12" fill="#214c65"/>
<text x="84" y="531" font-size="16" fill="#fff">Evidence → hypothesis → requirement → decision → implementation</text>
<text x="84" y="558" font-size="16" fill="#d6e5ed">→ test → changelog → handoff</text>
<text x="40" y="620" font-size="13" fill="#526c7b">Documentation supports traceability; it does not prove correctness or eliminate AI errors.</text>
</g></svg>
