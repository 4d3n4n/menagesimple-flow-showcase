<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Software architecture of the MénageSimple Flow demo</title>
<desc id="desc">Three role-specific interfaces connect to authorized server workflows. The server validates AI interpretation, uses deterministic domain rules and persists mission and audit records.</desc>
