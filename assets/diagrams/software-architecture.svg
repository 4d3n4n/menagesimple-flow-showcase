<text x="40" y="76" font-size="15" fill="#526c7b">Conceptual software architecture · synthetic-data demonstration</text>
<g fill="#fff" stroke="#ccdbe3"><rect x="40" y="110" width="290" height="96" rx="12"/><rect x="355" y="110" width="290" height="96" rx="12"/><rect x="670" y="110" width="290" height="96" rx="12"/></g>
